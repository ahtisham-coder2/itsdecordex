<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Phone reviews by DecodeX — specs, pros, cons and verdicts. Prices in PKR may vary.">
  <title>Phone Reviews — DecodeX</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%233b82f6' rx='20' width='100' height='100'/><text x='50' y='68' font-size='50' font-weight='bold' fill='white' text-anchor='middle' font-family='system-ui'>X</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>
  <div id="scroll-progress" class="scroll-progress"></div>

  <div id="site-header"></div>

  <main>
    <section class="section">
      <div class="container">
        <div class="section-header">
          <span class="section-header__eyebrow">Reviews</span>
          <h1 class="section-header__title">Phone reviews</h1>
          <p class="section-header__desc">Detailed specs, pros & cons, and DecodeX verdicts. All prices in PKR — price may vary.</p>
        </div>
        <div class="flex-between" style="margin-bottom:var(--space-6);flex-wrap:wrap;gap:var(--space-3)">
          <a href="finder.html" class="btn btn--primary btn--sm">Phone Finder</a>
          <a href="compare.html" class="btn btn--secondary btn--sm">Compare phones</a>
        </div>
        <div id="reviews-grid" class="grid grid--3"></div>
      </div>
    </section>

    <!-- Detail panel (filled by JS when hash matches) -->
    <section id="review-detail" class="section section--sm" style="display:none;background:var(--color-bg-secondary)">
      <div class="container" style="max-width:900px">
        <div id="review-detail-content"></div>
      </div>
    </section>
  </main>
<div id="site-footer"></div>
  <button id="back-to-top" class="back-to-top" aria-label="Back to top"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 15l-6-6-6 6"/></svg></button>
  <div id="search-overlay" class="search-overlay" role="dialog" aria-modal="true"><div class="search-modal"><div class="search-input-wrap"><input type="search" id="search-input" placeholder="Search…" aria-label="Search"><button id="search-close" class="btn btn--ghost btn--sm">Esc</button></div><div id="search-results" class="search-results"></div></div></div>

  <script src="../data/phones.js"></script>
  <script src="../data/videos.js"></script>
  <script src="../js/partials.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    (function () {
      const grid = document.getElementById('reviews-grid');
      const detail = document.getElementById('review-detail');
      const detailContent = document.getElementById('review-detail-content');
      if (!window.PHONES_DATA || !grid) return;

      grid.innerHTML = window.PHONES_DATA.map(p => `
        <article class="phone-card" id="${p.id}">
          <div class="phone-card__img"><img src="${p.image}" alt="${p.name}" loading="lazy" width="200" height="200"></div>
          <div class="phone-card__body">
            <span class="phone-card__brand">${p.brand}</span>
            <h2 class="phone-card__name" style="font-size:var(--fs-lg)">${p.name}</h2>
            <div class="phone-card__rating"><span class="stars">${'★'.repeat(Math.floor(p.rating))}${'☆'.repeat(5-Math.floor(p.rating))}</span> <span style="font-size:var(--fs-xs);color:var(--color-text-muted)">${p.rating}</span></div>
            <div class="phone-card__price">PKR ${p.pricePKR.toLocaleString()}</div>
            <p class="phone-card__price-note">Price may vary</p>
            <div class="phone-card__specs">
              <span class="tag">${p.display.size}</span>
              <span class="tag">${p.chipset.split(' ').slice(0,2).join(' ')}</span>
              <span class="tag">${p.battery}</span>
            </div>
            <div class="phone-card__actions">
              <button class="btn btn--primary btn--sm" data-detail="${p.id}">Full review</button>
            </div>
          </div>
        </article>
      `).join('');

      function showDetail(id) {
        const p = window.PHONES_DATA.find(x => x.id === id);
        if (!p) return;
        detail.style.display = 'block';
        detailContent.innerHTML = `
          <a href="#${p.id}" class="btn btn--ghost btn--sm" style="margin-bottom:var(--space-4)">← Back to list</a>
          <div class="grid grid--2" style="gap:var(--space-8);align-items:start">
            <div>
              <img src="${p.image}" alt="${p.name}" style="border-radius:var(--radius-xl);width:100%;max-width:320px" width="320" height="320">
              <div class="phone-card__price" style="margin-top:var(--space-4)">PKR ${p.pricePKR.toLocaleString()}</div>
              <p class="phone-card__price-note">Price may vary · ${p.availability}</p>
            </div>
            <div>
              <span class="badge">${p.brand}</span>
              <h2 style="margin:var(--space-3) 0">${p.name}</h2>
              <p style="margin-bottom:var(--space-4)">${p.verdict}</p>
              <h3 style="font-size:var(--fs-md);margin-bottom:var(--space-2)">Key specs</h3>
              <ul style="font-size:var(--fs-sm);color:var(--color-text-secondary);margin-bottom:var(--space-4)">
                <li>Display: ${p.display.size} ${p.display.type} ${p.display.refreshRate}</li>
                <li>Chipset: ${p.chipset}</li>
                <li>RAM / Storage: ${p.ram} / ${p.storage}</li>
                <li>Cameras: ${p.cameras.rear} (rear) · ${p.cameras.front} (front)</li>
                <li>Battery: ${p.battery} · ${p.charging}</li>
                <li>OS: ${p.os}</li>
                <li>Weight: ${p.weight} · ${p.waterResistance}</li>
              </ul>
              <div class="grid grid--2" style="gap:var(--space-4)">
                <div>
                  <h4 style="color:var(--color-success);margin-bottom:var(--space-2)">Pros</h4>
                  <ul style="font-size:var(--fs-sm);color:var(--color-text-secondary)">${p.pros.map(x=>'<li>• '+x+'</li>').join('')}</ul>
                </div>
                <div>
                  <h4 style="color:var(--color-error);margin-bottom:var(--space-2)">Cons</h4>
                  <ul style="font-size:var(--fs-sm);color:var(--color-text-secondary)">${p.cons.map(x=>'<li>• '+x+'</li>').join('')}</ul>
                </div>
              </div>
            </div>
          </div>
        `;
        detail.scrollIntoView({ behavior: 'smooth' });
      }

      grid.querySelectorAll('[data-detail]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-detail');
          history.replaceState(null, '', '#' + id);
          showDetail(id);
        });
      });

      if (location.hash) {
        const id = location.hash.slice(1);
        if (window.PHONES_DATA.some(p => p.id === id)) showDetail(id);
      }
    })();
  </script>
</body>
</html>
