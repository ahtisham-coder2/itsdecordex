<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DecodeX videos — mobile reviews, comparisons, tips on YouTube and TikTok.">
  <title>Videos — DecodeX</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%233b82f6' rx='20' width='100' height='100'/><text x='50' y='68' font-size='50' font-weight='bold' fill='white' text-anchor='middle' font-family='system-ui'>X</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>
  <div id="scroll-progress" class="scroll-progress"></div>
  <div id="site-header"></div>
  <main>
    <section class="section">
      <div class="container">
        <div class="section-header">
          <span class="section-header__eyebrow">Videos</span>
          <h1 class="section-header__title">Watch DecodeX</h1>
          <p class="section-header__desc">TikTok-style cards · swipe on mobile · YouTube & TikTok links. Demo content for structure.</p>
        </div>
        <div class="carousel-nav">
          <button id="video-prev" class="carousel-btn" aria-label="Previous"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
          <button id="video-next" class="carousel-btn" aria-label="Next"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button>
        </div>
        <div class="video-carousel"><div id="video-track" class="video-track" role="list"></div></div>
        <div class="text-center" style="margin-top:var(--space-10)">
          <a href="https://youtube.com/@itsdecordex" class="btn btn--primary" target="_blank" rel="noopener">YouTube channel</a>
          <a href="https://www.tiktok.com/@itsdecordex" class="btn btn--secondary" style="margin-left:var(--space-3)" target="_blank" rel="noopener">TikTok</a>
        </div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <button id="back-to-top" class="back-to-top" aria-label="Back to top"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 15l-6-6-6 6"/></svg></button>
  <div id="search-overlay" class="search-overlay" role="dialog" aria-modal="true"><div class="search-modal"><div class="search-input-wrap"><input type="search" id="search-input" placeholder="Search…" aria-label="Search"><button id="search-close" class="btn btn--ghost btn--sm">Esc</button></div><div id="search-results" class="search-results"></div></div></div>
  <script>document.getElementById('year').textContent=new Date().getFullYear();</script>
  <script src="../data/phones.js"></script>
  <script src="../data/videos.js"></script>

  <script src="../js/partials.js"></script>
  <script src="../js/app.js"></script>
  <div class="video-modal" id="video-modal" aria-hidden="true">
  <div class="video-modal__backdrop" data-modal-close></div>
  <div class="video-modal__box">
    <button class="video-modal__close" data-modal-close aria-label="Close video">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <div class="video-modal__frame" id="video-modal-frame"></div>
  </div>
</div>
</body>
</html>
